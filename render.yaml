databases:
  - name: hyggerb-db
    databaseName: hyggerb
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: hyggerb
    runtime: ruby
    plan: starter
    region: frankfurt
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hyggerb-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: APP_HOST
        value: hyggerb.dk
      - key: ORGANISER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
